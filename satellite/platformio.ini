; Vigilance Satellite - mini ESP-NOW firmware for a swarm node.
; Needs Arduino-ESP32 3.x (ESP-IDF 5.x) for the modern ESP-NOW API
; (esp_now_recv_info_t), the same as the Vigilance master.

[platformio]
default_envs = esp32-c3

; pioarduino platform = Arduino-ESP32 3.x (ESP-IDF 5.x), the SAME as the Vigilance
; master -> modern ESP-NOW API (esp_now_recv_info_t). The old official
; espressif32 6.x platform (Arduino 2.x) does NOT compile this firmware.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

; ESP32-C3 (e.g. a C3 SuperMini, ~1-2 EUR) - default target
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; classic ESP32 (devkit)
[env:esp32]
board = esp32dev

; ESP32-S3
[env:esp32-s3]
board = esp32-s3-devkitc-1
