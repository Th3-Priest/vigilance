---
# Vigilance build check. Compiles the watch (T-Embed CC1101 Plus) and the swarm
# satellite (ESP32-C3). Releases are cut by hand, so there is no auto-publish or
# website-deploy step here (those were Bruce-specific and referenced infra this
# fork does not have).
name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "**.h"
      - "**.hpp"
      - "**.c"
      - "**.cpp"
      - "**.ino"
      - "**.py"
      - "**.ini"
      - "**.json"
      - "**.csv"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "watch (T-Embed CC1101)", env: "lilygo-t-embed-cc1101", dir: "." }
          - { label: "satellite (ESP32-C3)",   env: "esp32-c3",              dir: "satellite" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps (multilib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ${{ matrix.dir }}/.pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}
          restore-keys: |
            pio-${{ matrix.env }}-

      - name: Install PlatformIO and build-script deps
        run: pip install platformio requests esptool intelhex

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: pio run -e ${{ matrix.env }}
